[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gutenberg_search_engine"
version = "0.1.0"
description = "A search engine for Project Gutenberg books."
readme = "README.md"
authors = [
    { name = "Jan Jabrocki" }
]
dependencies = [
    "scikit-learn",
    "nltk",
    "scrapy",
    "peewee",
    "numpy",
    "scrapy",
    "streamlit",
    "joblib",
]


[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapper*", "search_engine*", "db*", "utils*", "frontend*"]

[tool.scrapy]
cfgdir = "scrapper"
